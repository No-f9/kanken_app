<style>
:root{
  --paper:#EEF5EF;      /* 学習帳の紙 */
  --sheet:#FBFDFB;      /* マスの中 */
  --grid:#CFE3D5;       /* うすいマス目 */
  --rule:#86B89A;       /* 罫線 */
  --cover:#2C7451;      /* 学習帳の表紙の緑 */
  --cover-d:#215B3F;
  --ink:#27313A;        /* えんぴつ */
  --ink2:#5F6D74;
  --red:#E0412E;        /* 赤ペン */
  --gold:#E0A21C;
  --silver:#98A6AF;
  --sky:#3D7FC9;
  --kyokasho:"KleeOneSub","Klee One","YuKyokasho","UD Digi Kyokasho N-R","Hiragino Mincho ProN",serif;
  --ui:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans",system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--ui);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;background-position:-1px -1px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#app{min-height:100%;padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.screen{max-width:1080px;margin:0 auto}
.k{font-family:var(--kyokasho);font-weight:400}

/* ---------- 共通の部品 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:0 28px;border-radius:999px;font-size:24px;font-weight:700;background:var(--cover);color:#fff;box-shadow:0 4px 0 var(--cover-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cover-d)}
.btn.ghost{background:var(--sheet);color:var(--cover);box-shadow:0 4px 0 var(--rule);border:2px solid var(--rule)}
.btn.small{min-height:48px;font-size:19px;padding:0 20px}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);border:2px solid var(--grid)}
.iconbtn svg{width:26px;height:26px}
.btn svg{width:22px;height:22px;flex:none}
.sheet{background:var(--sheet);border:2px solid var(--rule);border-radius:var(--r)}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;min-height:56px}
.topbar h2{margin:0;font-size:26px;font-weight:900;flex:1}
.muted{color:var(--ink2)}
.hidden{display:none!important}

/* ---------- ホーム ---------- */
.home{display:grid;gap:20px;grid-template-columns:1.2fr 1fr;align-items:start}
.cover{grid-column:1/-1;display:flex;align-items:center;gap:22px;background:var(--cover);color:#fff;border-radius:22px;padding:22px 28px;position:relative;overflow:hidden}
.cover .label{background:#fff;color:var(--ink);border-radius:10px;padding:10px 22px;font-size:30px;font-weight:900;letter-spacing:.05em}
.cover .label small{display:block;font-size:15px;font-weight:700;color:var(--cover)}
.cover .count{margin-left:auto;text-align:right;font-weight:700;font-size:19px;line-height:1.3}
.cover .count b{font-size:44px;font-weight:900;display:inline-block;margin:0 4px}
.today{padding:26px;display:flex;flex-direction:column;gap:18px}
.today h3{margin:0;font-size:22px}
.today .meta{font-size:20px;color:var(--ink2)}
.today .btn{min-height:84px;font-size:30px}
.streak{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:var(--ink2)}
.zukan-peek{padding:22px;cursor:pointer}
.zukan-peek h3{margin:0 0 6px;font-size:22px;display:flex;justify-content:space-between;align-items:baseline}
.zukan-peek h3 span{font-size:18px;color:var(--ink2);font-weight:700}
.minigrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:12px}
.minigrid i{aspect-ratio:1;border-radius:3px;background:#fff;border:1px dashed var(--grid)}
.minigrid i.s1{border:1px solid var(--rule);background:#fff}
.minigrid i.s2{background:#D6E6F7;border:1px solid #B5CFEA}
.minigrid i.s3{background:var(--sky);border:1px solid var(--sky)}
.minigrid i.s4{background:var(--sky);border:2px solid var(--silver)}
.minigrid i.s5{background:var(--sky);border:2px solid var(--gold)}
.stars{display:flex;gap:16px;font-weight:700;font-size:17px;color:var(--ink2);margin-top:10px}
.side{display:flex;flex-direction:column;gap:20px}
.mock-peek{padding:22px;display:flex;align-items:center;gap:16px}
.mock-peek div{flex:1}
.mock-peek h3{margin:0;font-size:22px}
.mock-peek p{margin:4px 0 0;color:var(--ink2);font-size:17px}
.parent-link{position:relative;align-self:flex-start;font-size:15px;color:var(--ink2);padding:10px 14px;border-radius:999px;border:1px dashed var(--rule);background:var(--sheet)}
.parent-link .fill{position:absolute;inset:0;border-radius:999px;background:var(--grid);transform-origin:left;transform:scaleX(0);z-index:-1}
.parent-link{isolation:isolate}

/* ---------- 学習 ---------- */
.progress{flex:1;height:14px;border-radius:999px;background:#fff;border:2px solid var(--grid);overflow:hidden}
.progress i{display:block;height:100%;background:var(--cover);border-radius:999px;transition:width .3s}
.qwrap{display:grid;gap:22px;grid-template-columns:1fr;align-items:start}
@media (orientation:landscape) and (min-width:900px){.qwrap.two{grid-template-columns:1.1fr 1fr}}
.prompt{padding:26px 28px}
.kind{display:inline-block;font-size:17px;font-weight:700;color:var(--cover);border:2px solid var(--rule);border-radius:999px;padding:4px 14px;margin-bottom:14px}
.prompt .ask{font-size:21px;color:var(--ink2);margin:0 0 16px}
.sentence{font-size:38px;line-height:2.3;font-weight:500;letter-spacing:.04em;word-break:keep-all;overflow-wrap:anywhere}
.sentence .tgt{font-family:var(--kyokasho);font-weight:600;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:10px;text-decoration-color:var(--red)}
.sentence ruby rt{font-size:18px;color:var(--red);font-family:var(--ui);font-weight:700}
.sentence .box{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1}
.sentence .box .kana{font-size:18px;color:var(--ink2);font-weight:700;margin-bottom:4px}
.sentence .box .sq{width:64px;height:64px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-family:var(--kyokasho);font-size:50px;color:var(--red)}
.answer-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.grade button{min-height:96px;border-radius:20px;background:var(--sheet);border:3px solid var(--grid);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:19px;font-weight:700;box-shadow:0 4px 0 var(--grid)}
.grade button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grid)}
.grade svg{width:42px;height:42px}
.writing{padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.masu{position:relative;width:min(62vmin,440px);aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:6px;touch-action:none}
.masu::before,.masu::after{content:"";position:absolute;pointer-events:none}
.masu::before{left:50%;top:0;bottom:0;border-left:2px dashed #F2A99F}
.masu::after{top:50%;left:0;right:0;border-top:2px dashed #F2A99F}
.masu canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none}
.masu .guide{position:absolute;inset:6%;width:88%;height:88%;z-index:1;pointer-events:none}
.tools{display:flex;gap:12px}
.compare{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.compare figure{margin:0;text-align:center}
.compare figcaption{font-size:17px;font-weight:700;color:var(--ink2);margin-top:6px}
.compare .pic{width:min(28vmin,200px);aspect-ratio:1;background:#fff;border:2px solid var(--ink);border-radius:6px;position:relative;display:grid;place-items:center}
.compare .pic img{width:100%;height:100%}
.compare .pic svg{width:88%;height:88%}
.numpad{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:20px}
.numpad button{height:72px;border-radius:16px;background:var(--sheet);border:3px solid var(--grid);font-size:32px;font-weight:900;box-shadow:0 4px 0 var(--grid)}
.numpad button.ok{border-color:var(--cover);background:#E3F1E8}
.numpad button.ng{border-color:var(--red);background:#FCE9E6}
.bigkanji{width:min(56vmin,360px);aspect-ratio:1;background:#fff;border:3px solid var(--ink);border-radius:6px;position:relative;margin:0 auto}
.bigkanji::before,.bigkanji::after{content:"";position:absolute;pointer-events:none}
.bigkanji::before{left:50%;top:0;bottom:0;border-left:2px dashed #F2A99F}
.bigkanji::after{top:50%;left:0;right:0;border-top:2px dashed #F2A99F}
.bigkanji svg{position:absolute;inset:6%;width:88%;height:88%}
.feedback{margin-top:18px;font-size:22px;font-weight:700;min-height:30px}
.feedback.ok{color:var(--cover)}
.feedback.ng{color:var(--red)}

/* 新出カード */
.intro{display:grid;gap:22px;grid-template-columns:1fr}
@media (orientation:landscape) and (min-width:900px){.intro{grid-template-columns:1fr 1fr}}
.intro .card{padding:24px}
.yomi-chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:24px;font-weight:700;padding:6px 16px;border-radius:12px;background:#fff;border:2px solid var(--grid)}
.chip small{font-size:14px;color:var(--ink2)}
.chip svg{width:20px;height:20px;color:var(--sky)}
.words{display:flex;flex-wrap:wrap;gap:12px}
.word{display:flex;flex-direction:column;align-items:center;padding:8px 16px;border-radius:12px;background:#fff;border:2px solid var(--grid)}
.word .w{font-family:var(--kyokasho);font-size:34px;font-weight:600}
.word .r{font-size:16px;color:var(--ink2);font-weight:700}
.sec-title{font-size:18px;font-weight:700;color:var(--ink2);margin:6px 0}

/* おわり */
.done{text-align:center;padding:30px 20px}
.done h2{font-size:40px;margin:10px 0}
.hanamaru{width:200px;height:200px;margin:0 auto}
.newstars{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:22px 0}
.flip{perspective:600px}
.flip .tile{animation:flip .7s both}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:rotateY(0);opacity:1}}

/* ---------- 図鑑 ---------- */
.zhead{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:18px 22px;margin-bottom:16px}
.zhead .big{font-size:22px;font-weight:900}
.zhead .big b{font-size:40px;color:var(--cover)}
.bar{flex:1;min-width:200px;height:18px;border-radius:999px;background:#fff;border:2px solid var(--grid);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.filters button{font-size:18px;font-weight:700;padding:10px 18px;border-radius:999px;background:var(--sheet);border:2px solid var(--grid)}
.filters button[aria-pressed=true]{background:var(--cover);color:#fff;border-color:var(--cover)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.tile{position:relative;aspect-ratio:1;border-radius:12px;background:#fff;display:grid;place-items:center;border:2px solid var(--grid);font-family:var(--kyokasho);font-size:52px;line-height:1;color:var(--ink)}

.tile.s1{color:#8E9AA1;border-color:var(--rule)}
.tile.s2{background:#EEF4FB;color:#7FA8D8;border-color:#C6D9EE}
.tile.s3,.tile.s4,.tile.s5{background:#E7F0FA;color:var(--sky);border-color:var(--sky)}
.tile.s4{border:4px solid var(--silver)}
.tile.s5{border:4px solid var(--gold);background:#FFF6DF}
.tile .tag{position:absolute;top:-8px;right:-8px;font-family:var(--ui);font-size:12px;font-weight:900;padding:2px 7px;border-radius:999px;color:#fff}
.tile .tag.weak{background:var(--red)}
.tile .tag.rev{background:var(--gold)}
.tile.pinch{animation:pinch 1.6s ease-in-out infinite}
@keyframes pinch{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.tile.pinch{animation:none;outline:3px dashed var(--red)} .flip .tile{animation:none}}
.zlegend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;font-size:16px;color:var(--ink2);font-weight:700}
.zlegend span{display:inline-flex;align-items:center;gap:6px}
.zlegend .tile{width:30px;font-size:18px;border-radius:6px}

/* 図鑑の1ページ */
.modal{position:fixed;inset:0;background:rgba(39,49,58,.35);display:grid;place-items:center;padding:20px;z-index:50}
.page{width:min(860px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--sheet);border-radius:22px;border:3px solid var(--rule);padding:24px;position:relative;-webkit-user-select:none}
.page .close{position:absolute;top:14px;right:14px}
.page-grid{display:grid;grid-template-columns:240px 1fr;gap:24px}
@media (max-width:700px){.page-grid{grid-template-columns:1fr}}
.page .bigkanji{width:240px}
.stage-name{font-size:22px;font-weight:900;margin:12px 0 4px;text-align:center}
.stage-name .s{color:var(--gold)}
.rec{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:18px;margin:8px 0}
.rec dt{color:var(--ink2);font-weight:700}
.rec dd{margin:0;font-weight:700}
.naritachi{background:#fff;border:2px dashed var(--rule);border-radius:14px;padding:14px 18px;font-size:20px;line-height:1.8}
.naritachi.locked{color:var(--ink2);text-align:center}
.hwpair{display:flex;gap:16px;align-items:flex-end}
.hwpair figure{margin:0;text-align:center}
.hwpair img{width:110px;height:110px;background:#fff;border:2px solid var(--ink);border-radius:6px}
.hwpair figcaption{font-size:15px;color:var(--ink2);font-weight:700}

/* ---------- おうちのかた ---------- */
.parent{display:grid;gap:18px}
.parent section{padding:20px 22px}
.parent h3{margin:0 0 12px;font-size:21px}
.parent label{display:flex;align-items:center;gap:12px;font-size:18px;margin:10px 0;flex-wrap:wrap}
.parent input,.parent select{font-family:inherit;font-size:18px;padding:8px 12px;border-radius:10px;border:2px solid var(--grid);background:#fff;color:var(--ink)}
.parent p{font-size:16px;line-height:1.7;color:var(--ink2);margin:6px 0}
.hwlog{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.hwlog figure{margin:0;text-align:center;font-size:14px;color:var(--ink2)}
.hwlog img{width:100%;aspect-ratio:1;background:#fff;border:2px solid var(--grid);border-radius:6px}
.hwlog .g{font-weight:900;font-size:16px}
.stats-table{width:100%;border-collapse:collapse;font-size:17px}
.stats-table td,.stats-table th{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:999px;font-size:18px;font-weight:700;z-index:99}

@media (max-width:820px){
  .home{grid-template-columns:1fr}
  .cover{flex-wrap:wrap}
  .cover .count{margin-left:0;text-align:left}
  .sentence{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- 日付 ---------- */
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const dayDiff=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
const endOfDay=d=>{const e=new Date(d);e.setHours(23,59,59,999);return e};
const today=()=>ymd(new Date());
const fmtDate=s=>{if(!s)return'—';const d=new Date(s);return`${d.getMonth()+1}がつ${d.getDate()}にち`};

/* ---------- 項目（1字につき よみ・かき・かきじゅん の3つ） ---------- */
const KINDS=['y','w','s'];
const itemIds=k=>KINDS.map(t=>`${k}:${t}`);
function getItem(id){
  if(!S.items[id]){S.items[id]={card:serCard(FSRS.createEmptyCard(new Date())),reps:0,lapses:0,last:null};}
  return S.items[id];
}
function serCard(c){return Object.assign({},c,{due:new Date(c.due).toISOString(),last_review:c.last_review?new Date(c.last_review).toISOString():null})}
function revCard(c){return Object.assign({},c,{due:new Date(c.due),last_review:c.last_review?new Date(c.last_review):undefined})}
function retr(it,at){if(!it||it.reps===0)return 0;try{return F.get_retrievability(revCard(it.card),at||new Date(),false)}catch(e){return 0}}
function kstate(k){return S.kanji[k]||(S.kanji[k]={intro:null,answers:0,misses:0,weak:false,revived:false,starAt:{}})}

function stage(k){
  const ks=S.kanji[k];if(!ks||!ks.intro)return 0;
  let minS=Infinity,any=false;
  for(const id of itemIds(k)){const it=S.items[id];if(!it||it.reps===0){minS=0;continue}any=true;minS=Math.min(minS,it.card.stability)}
  if(!any)return 1;
  if(minS>=STAGE_DAYS[2])return 5;if(minS>=STAGE_DAYS[1])return 4;if(minS>=STAGE_DAYS[0])return 3;return 2;
}
function isPinch(k){
  if(stage(k)<3)return false;
  return itemIds(k).some(id=>{const it=S.items[id];return it&&(it.last==='again'||retr(it)<0.8)});
}
function starsText(st){return st>=3?'★'.repeat(st-2):''}

/* ---------- 今日の計画 ---------- */
function introOrder(){
  let ks=KANJI.slice();
  if(S.settings.order==='strokes')ks.sort((a,b)=>STROKES[a].length-STROKES[b].length);
  const pri=S.priority.filter(k=>!kstate(k).intro);
  return pri.concat(ks.filter(k=>!pri.includes(k)));
}
function examInfo(){
  const t=new Date();const ex=S.settings.examDate?parseYmd(S.settings.examDate):null;
  const days=ex?dayDiff(t,ex):null;
  return{ex,days,future:days!==null&&days>=0,finishing:days!==null&&days>=0&&days<=S.settings.finishDays};
}
function dueItems(){
  const now=new Date(),eod=endOfDay(now),td=today();
  const out=[];
  for(const k of KANJI){
    const ks=S.kanji[k];if(!ks||!ks.intro)continue;
    for(const id of itemIds(k)){
      const it=getItem(id);
      if(it.reps===0){ if(ks.intro<td)out.push(id); }
      else if(new Date(it.card.due)<=eod)out.push(id);
    }
  }
  return out.sort((a,b)=>retr(S.items[a])-retr(S.items[b]));
}
function planToday(){
  const td=today();
  if(S.plan&&S.plan.date===td)return S.plan;
  const budget=Math.round(S.settings.minutes*60/PER_CARD_SEC);
  const due=dueItems();
  const order=introOrder().filter(k=>!kstate(k).intro);
  const ei=examInfo();
  let perDay;
  if(ei.future){
    const span=Math.max(1,ei.days-S.settings.finishDays);
    perDay=ei.finishing?Math.min(order.length,10):Math.ceil(order.length/span);
  }else perDay=5;
  const capacity=Math.floor((budget-due.length)/4);
  let n=due.length>budget?0:Math.min(perDay,Math.max(2,capacity));
  n=Math.min(n,order.length);
  S.plan={date:td,newK:order.slice(0,n)};save();
  return S.plan;
}
function buildSession(){
  const plan=planToday(),td=today();
  const budget=Math.round(S.settings.minutes*60/PER_CARD_SEC);
  const pending=plan.newK.filter(k=>{const ks=kstate(k);return !ks.intro||ks.intro===td&&!ks.introDone});
  const doneToday=new Set((S.days[td]&&S.days[td].rated)||[]);
  let reviews=dueItems().filter(id=>!doneToday.has(id));
  const room=Math.max(6,budget-pending.length*3);
  let extra=[];
  const ei=examInfo();
  if(ei.finishing&&reviews.length<room){
    const at=endOfDay(ei.ex);const set=new Set(reviews);
    extra=KANJI.filter(k=>kstate(k).intro).flatMap(itemIds)
      .filter(id=>!set.has(id)&&!doneToday.has(id)&&S.items[id]&&S.items[id].reps>0&&retr(S.items[id],at)<0.9)
      .sort((a,b)=>retr(S.items[a],at)-retr(S.items[b],at));
  }
  reviews=reviews.slice(0,room).concat(extra.slice(0,Math.max(0,room-reviews.length)));
  const rv=reviews.map(id=>makeCard(id));
  const blocks=pending.map(k=>[{type:'intro',k},makeCard(`${k}:y`,0),makeCard(`${k}:w`,0)]);
  // ふくしゅう 4まいごとに あたらしい かんじを はさむ
  const q=[];let bi=0;
  for(let i=0;i<rv.length;i++){q.push(rv[i]);if((i+1)%4===0&&bi<blocks.length)q.push(...blocks[bi++]);}
  while(bi<blocks.length)q.push(...blocks[bi++]);
  return q;
}
function makeCard(id,variant){
  const[k,t]=id.split(':');const it=getItem(id);
  if(t==='y')return{type:'yomi',id,k,v:variant!=null?variant:it.reps%2};
  if(t==='w')return{type:'kaki',id,k,v:variant!=null?variant:(it.reps+1)%2};
  return{type:it.reps%2===0?'hitsu':'kakusu',id,k,hi:pickStroke(k,it.reps)};
}
function pickStroke(k,seed){const n=STROKES[k].length;if(n<=1)return 0;return (seed*7+3+k.charCodeAt(0))%n}

/* ---------- 採点の反映 ---------- */
function rate(id,g){
  const it=getItem(id);const now=new Date();
  const r=F.next(revCard(it.card),now,RMAP[g]);
  it.card=serCard(r.card);it.reps++;it.last=g;if(g==='again')it.lapses++;
  const k=id.split(':')[0];const ks=kstate(k);
  ks.answers++;if(g==='again')ks.misses++;
  if(ks.misses>=3)ks.weak=true;
  const st=stage(k);
  for(const s of [3,4,5])if(st>=s&&!ks.starAt[s])ks.starAt[s]=now.toISOString();
  if(ks.weak&&st>=3&&!ks.revived){ks.revived=true;ks.revivedNew=true}
  const td=today();const day=S.days[td]||(S.days[td]={n:0,rated:[],done:false});
  day.n++;if(!day.rated.includes(id))day.rated.push(id);
  save();
}

/* 筆順 SVG（KanjiVG） */
function startPt(d){const m=d.match(/[Mm]\s*([-\d.]+)[ ,]*([-\d.]+)/);return m?[+m[1],+m[2]]:[0,0]}
function strokeSvg(k,o={}){
  const ps=STROKES[k];const w=o.w||4.2;
  let s=`<svg viewBox="0 0 109 109" aria-label="${esc(k)}" role="img">`;
  ps.forEach((d,i)=>{
    let col=o.color||'#27313A';
    if(o.hi!=null){col=i===o.hi?'#E0412E':'#B8C2C8'}
    s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${o.hi===i?w+1.2:w}" stroke-linecap="round" stroke-linejoin="round" data-i="${i}"/>`;
  });
  if(o.numbers){
    const placed=[];
    ps.forEach((d,i)=>{
      const[sx,sy]=startPt(d);let x=Math.max(4,sx-7),y=Math.max(9,sy-2);
      // ほかの番号と重なるときは ずらす
      const moves=[[0,0],[-8,0],[0,-9],[-8,-9],[8,-9],[0,10],[-14,0]];
      for(const[dx,dy]of moves){const tx=Math.min(102,Math.max(2,x+dx)),ty=Math.min(106,Math.max(9,y+dy));
        if(placed.every(([px,py])=>Math.abs(px-tx)>7||Math.abs(py-ty)>8)){x=tx;y=ty;break}}
      placed.push([x,y]);
      s+=`<text x="${x}" y="${y}" font-size="9" font-family="Hiragino Maru Gothic ProN,Zen Maru Gothic,sans-serif" font-weight="700" fill="#E0412E" data-n="${i}">${i+1}</text>`;
    });
  }
  return s+'</svg>';
}
let animToken=0;
function animate(svg,delay=0){
  const tok=++animToken;const paths=[...svg.querySelectorAll('path')];const nums=[...svg.querySelectorAll('text')];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  paths.forEach(p=>{const L=p.getTotalLength();p.style.transition='none';p.style.strokeDasharray=L;p.style.strokeDashoffset=reduce?0:L});
  nums.forEach(n=>n.style.opacity=reduce?1:0);
  if(reduce)return;
  let t=delay;
  paths.forEach((p,i)=>{const L=p.getTotalLength();const dur=Math.max(320,L*11);
    setTimeout(()=>{if(tok!==animToken)return;if(nums[i])nums[i].style.opacity=1;p.style.transition=`stroke-dashoffset ${dur}ms linear`;p.style.strokeDashoffset=0},t);
    t+=dur+180;});
}

/* 手書きパッド */
class Pad{
  constructor(canvas){
    this.c=canvas;this.x=canvas.getContext('2d');this.strokes=[];this.cur=null;this.onchange=null;
    this.resize();
    const pos=e=>{const r=this.c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
    canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);this.cur=[pos(e)];this.strokes.push(this.cur);this.draw()});
    canvas.addEventListener('pointermove',e=>{if(!this.cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs)this.cur.push(pos(ev));this.draw()});
    const up=()=>{if(this.cur){this.cur=null;this.onchange&&this.onchange()}};
    canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
    this._ro=new ResizeObserver(()=>this.resize());this._ro.observe(canvas);
  }
  resize(){const r=this.c.getBoundingClientRect();const d=window.devicePixelRatio||1;this.c.width=Math.max(1,r.width*d);this.c.height=Math.max(1,r.height*d);this.draw()}
  draw(ctx=this.x,W=this.c.width,H=this.c.height){
    ctx.clearRect(0,0,W,H);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#27313A';ctx.lineWidth=W*0.04;
    for(const s of this.strokes){ctx.beginPath();s.forEach(([x,y],i)=>i?ctx.lineTo(x*W,y*H):ctx.moveTo(x*W,y*H));if(s.length===1)ctx.lineTo(s[0][0]*W+0.1,s[0][1]*H);ctx.stroke()}
  }
  undo(){this.strokes.pop();this.draw();this.onchange&&this.onchange()}
  clear(){this.strokes=[];this.draw();this.onchange&&this.onchange()}
  get empty(){return this.strokes.length===0}
  image(size=180){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);this.draw(x,size,size);return c.toDataURL('image/png')}
  destroy(){this._ro&&this._ro.disconnect()}
}

function calcStreak(){
  let n=0;const d=new Date();
  if(!(S.days[ymd(d)]&&S.days[ymd(d)].n))d.setDate(d.getDate()-1);
  while(S.days[ymd(d)]&&S.days[ymd(d)].n){n++;d.setDate(d.getDate()-1)}
  return n;
}
function longPress(el,fn){
  let t=null;const fill=el.querySelector('.fill');
  const start=e=>{e.preventDefault();fill.style.transition='transform 1.2s linear';fill.style.transform='scaleX(1)';t=setTimeout(()=>{t=null;fn()},1200)};
  const stop=()=>{if(t){clearTimeout(t);t=null}fill.style.transition='transform .2s';fill.style.transform='scaleX(0)'};
  el.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener('keydown',e=>{if(e.key==='Enter')fn()});
}

  SESSION={q,i:0,total:q.length,before,rated:new Set(),mode:'study'};
  nextCard();
}
function header(){
  const s=SESSION;const pct=Math.round(s.i/Math.max(1,s.q.length)*100);
  return`<div class="topbar"><button class="iconbtn" id="quit" aria-label="ホームへ">${IC.home}</button><div class="progress"><i style="width:${pct}%"></i></div><span class="muted" style="font-weight:700;font-size:18px">${Math.max(0,s.q.length-s.i)}</span></div>`;
}
function nextCard(){
  const s=SESSION;
  if(s.i>=s.q.length){s.mode==='mock'?mockResult():finishStudy();return}
  const c=s.q[s.i];
  ({intro:showIntro,yomi:showYomi,kaki:showKaki,hitsu:showHitsu,kakusu:showKakusu})[c.type](c);
  $('#quit').onclick=async()=>{if(s.mode==='mock'&&!(await ask('もぎテストを やめる？','やめる',false,'つづける')))return;Home()};
}
function advance(c,g,auto){
  const s=SESSION;
  if(s.mode==='mock'){s.answers.push({c,g});s.i++;nextCard();return}
  if(c.type!=='intro'&&!s.rated.has(c.id)){rate(c.id,g);s.rated.add(c.id)}
  if(g==='again'){ // すこしあとで もういちど
    const again=Object.assign({},c,{retry:true});
    if(again.type==='yomi'||again.type==='kaki')again.v=1-again.v;
    s.q.splice(Math.min(s.q.length,s.i+4),0,again);
  }
  s.i++;nextCard();
}
function gradeButtons(){
  return`<div class="grade">
    <button data-g="again">${IC.batsu}まちがえた</button>
    <button data-g="hard">${IC.sankaku}あやしい</button>
    <button data-g="good">${IC.maru}できた</button></div>`;
}

function saveHw(k,img,g){
  if(!HW.first[k])HW.first[k]={img,t:Date.now()};
  HW.last[k]={img,t:Date.now()};
  S.hwlog.push({k,t:Date.now(),g,img});if(S.hwlog.length>60)S.hwlog=S.hwlog.slice(-60);
  save();
}
/* まちがえたら なぞって なおす */
function traceFix(c,done){
  $('#after').innerHTML=`<div class="feedback ng">ただしい かたちを 1かい なぞろう</div>`;
  $('#wbox').innerHTML=`<div class="masu"><svg class="guide" viewBox="0 0 109 109">${STROKES[c.k].map(p=>`<path d="${p}" fill="none" stroke="#F5C4BC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg><canvas></canvas></div>
    <div class="tools"><button class="iconbtn" id="undo" aria-label="1かく もどす">${IC.undo}</button><button class="btn ghost small" id="clear">ぜんぶ けす</button></div>

  const pad=new Pad($('#wbox canvas'));pads.push(pad);
  pad.onchange=()=>{$('#fixed').disabled=pad.strokes.length<Math.min(STROKES[c.k].length,2)};
  $('#undo').onclick=()=>pad.undo();$('#clear').onclick=()=>pad.clear();
  $('#fixed').onclick=done;
}

function numpadHandler(c,answer,showModel,label){
  let first=true;
  document.querySelectorAll('.numpad button').forEach(b=>b.onclick=()=>{
    if(!first)return;first=false;
    const v=+b.dataset.n;const ok=v===answer;
    b.classList.add(ok?'ok':'ng');
    if(!ok)document.querySelector(`.numpad button[data-n="${answer}"]`).classList.add('ok');
    $('#fb').className='feedback '+(ok?'ok':'ng');
    $('#fb').textContent=ok?`せいかい！ ${label}`:`こたえは ${label}。かきじゅんを みてみよう`;
    showModel();
    $('#nx').innerHTML=`<div style="text-align:right;margin-top:16px"><button class="btn" id="go">つぎへ</button></div>`;
    $('#go').onclick=()=>advance(c,ok?'good':'again',true);
  });
}

  const ups=KANJI.filter(k=>stage(k)>=3&&stage(k)>SESSION.before[k]);

  mount(`<div class="sheet done">
    ${hanamaruSvg()}

function hanamaruSvg(){
  return`<svg class="hanamaru" viewBox="0 0 200 200" aria-label="はなまる"><path id="hm" d="M100 46c-34 0-58 22-58 52s25 54 58 54 56-22 56-52c0-26-20-44-46-44-22 0-38 14-38 34s15 32 34 32c16 0 26-10 26-24 0-12-9-20-20-20" fill="none" stroke="#E0412E" stroke-width="7" stroke-linecap="round"/>
  ${[0,1,2,3,4,5,6,7].map(i=>{const a=i*Math.PI/4;const x=100+Math.cos(a)*84,y=100+Math.sin(a)*84;return`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="18" ry="11" transform="rotate(${i*45} ${x.toFixed(1)} ${y.toFixed(1)})" fill="none" stroke="#E0412E" stroke-width="5" class="petal" style="opacity:0"/>`}).join('')}</svg>`;
}
function drawHanamaru(){
  const p=$('#hm');if(!p)return;const L=p.getTotalLength();
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('.petal').forEach(e=>e.style.opacity=1);return}
  p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
  requestAnimationFrame(()=>{p.style.transition='stroke-dashoffset 1s ease-out';p.style.strokeDashoffset=0});
  document.querySelectorAll('.petal').forEach((e,i)=>setTimeout(()=>{e.style.transition='opacity .15s';e.style.opacity=1},1000+i*70));
}

/* =================== 図鑑 =================== */
let zFilter='all';
function Zukan(){
  const st=Object.fromEntries(KANJI.map(k=>[k,stage(k)]));
  const counts=[0,0,0,0,0,0];KANJI.forEach(k=>counts[st[k]]++);
  const learned=counts[3]+counts[4]+counts[5];
  let list=KANJI.slice();
  if(zFilter==='strokes')list.sort((a,b)=>STROKES[a].length-STROKES[b].length);
  if(zFilter==='stars')list.sort((a,b)=>st[b]-st[a]);
  if(zFilter==='weak')list=list.filter(k=>S.kanji[k]&&S.kanji[k].weak);
  const seg=(n,col)=>n?`<i style="width:${n/80*100}%;background:${col}"></i>`:'';
  mount(`<div class="topbar"><button class="iconbtn" id="back" aria-label="もどる">${IC.back}</button><h2>かんじ ずかん</h2></div>
  <div class="sheet zhead">
    <div class="big"><b>${learned}</b> / 80 おぼえた</div>
    <div class="bar">${seg(counts[5],'var(--gold)')}${seg(counts[4],'var(--silver)')}${seg(counts[3],'var(--sky)')}${seg(counts[2],'#B5CFEA')}${seg(counts[1],'var(--rule)')}</div>
    <div class="stars" style="margin:0"><span style="color:var(--gold)">★ ${counts[3]}</span><span>★★ ${counts[4]}</span><span>★★★ ${counts[5]}</span></div>
  </div>
  <div class="filters" role="group">
    ${[['all','ぜんぶ'],['strokes','かくすうが すくない じゅん'],['stars','ほしが おおい じゅん'],['weak','にがて']].map(([v,l])=>`<button data-f="${v}" aria-pressed="${zFilter===v}">${l}</button>`).join('')}
  </div>
  <div class="zgrid">${list.map(k=>tileHtml(k,st[k])).join('')||'<p class="muted" style="font-size:20px">にがての かんじは まだ ないよ</p>'}</div>
  <div class="zlegend">
    ${[0,1,2,3,4,5].map(s=>`<span><span class="tile s${s}">字</span>${['かげ','であった','れんしゅう','★ おぼえた','★★ しっかり','★★★ かんぺき'][s]}</span>`).join('')}
    <span><span class="tile s3 pinch">字</span>ぴんち（もうすぐ わすれそう）</span>
  </div>`);
  $('#back').onclick=()=>Home();
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{zFilter=b.dataset.f;Zukan()});
  document.querySelectorAll('.zgrid .tile').forEach(t=>t.onclick=()=>kanjiPage(t.dataset.k));
}
function tileHtml(k,s){
  const ks=S.kanji[k]||{};const pinch=isPinch(k);
  const tag=ks.revived&&s>=3?'<span class="tag rev">ふっかつ</span>':(ks.weak?'<span class="tag weak">にがて</span>':'');
  return`<button class="tile s${s}${pinch?' pinch':''}" data-k="${k}" aria-label="${k} ${STAGE_NAMES[s]}">${k}<span class="st">${starsText(s)}</span>${tag}</button>`;
}
function kanjiPage(k){
  const d=BYK[k];const s=stage(k);const ks=S.kanji[k]||{};
  if(s===0){toast('まだ であって いない かんじだよ');return}
  const m=document.createElement('div');m.className='modal';
  const hf=HW.first[k],hl=HW.last[k];
  m.innerHTML=`<div class="page" role="dialog" aria-label="${k}">
    <button class="iconbtn close" aria-label="とじる">${IC.close}</button>
    <div class="page-grid">
      <div>
        <div class="bigkanji" id="pk">${strokeSvg(k,{numbers:true})}</div>

      </div>

        <div class="sec-title">よみかた</div>
        <div class="yomi-chips">${d.on.map(r=>`<button class="chip" data-say="${esc(kata2hira(r))}">${IC.speak}${esc(r)}</button>`).join('')}${d.kun.map(r=>`<button class="chip" data-say="${esc(r.replace(/[()]/g,''))}">${IC.speak}${esc(r.replace('(','（').replace(')','）'))}</button>`).join('')}</div>
        <div class="sec-title">ことば</div>
        <div class="words">${d.words.map(w=>`<button class="word" data-say="${esc(w.r)}"><span class="w">${esc(w.w)}</span><span class="r">${esc(w.r)}</span></button>`).join('')}</div>
        <div class="sec-title" style="margin-top:16px">なりたち</div>
        ${s>=3?`<div class="naritachi">${esc(d.naritachi)}</div>`:`<div class="naritachi locked">★を とると よめるよ</div>`}
        <div class="sec-title" style="margin-top:16px">じぶんの きろく</div>
        <dl class="rec">
          <dt>であった ひ</dt><dd>${fmtDate(ks.intro&&parseYmd(ks.intro))}</dd>

      </div>
    </div></div>`;
  document.body.appendChild(m);
  const close=()=>{animToken++;m.remove()};
  m.querySelector('.close').onclick=close;m.onclick=e=>{if(e.target===m)close()};

/* =================== もぎテスト =================== */
function Mock(){
  mount(`<div class="topbar"><button class="iconbtn" id="back" aria-label="もどる">${IC.back}</button><h2>もぎテスト</h2></div>
  <div class="sheet prompt" style="font-size:21px;line-height:1.8">
    <p style="margin-top:0">ほんばんと おなじ かたちの もんだいが ${MOCK.yomi+MOCK.kaki+MOCK.stroke}もん でるよ。</p>
    <p>よみ ${MOCK.yomi}もん・かきとり ${MOCK.kaki}もん・かきじゅんと かくすう ${MOCK.stroke}もん<br>150てん まんてんで、${MOCK.pass}てん いじょうが ごうかくの めやすだよ。</p>
    <p class="muted" style="font-size:17px">80じ ぜんぶから でるので、まだ ならって いない かんじも でるよ。</p>
    <button class="btn" id="go">はじめる</button>
  </div>`);
  $('#back').onclick=()=>Home();
  $('#go').onclick=startMock;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startMock(){
  const ks=shuffle(KANJI);
  const q=[];
  ks.slice(0,MOCK.yomi).forEach(k=>q.push({type:'yomi',id:`${k}:y`,k,v:Math.random()<.5?0:1}));
  ks.slice(MOCK.yomi,MOCK.yomi+MOCK.kaki).forEach(k=>q.push({type:'kaki',id:`${k}:w`,k,v:Math.random()<.5?0:1}));
  ks.slice(MOCK.yomi+MOCK.kaki).filter(k=>STROKES[k].length>1).slice(0,MOCK.stroke).forEach((k,i)=>q.push({type:i%2?'kakusu':'hitsu',id:`${k}:s`,k,hi:pickStroke(k,i+Date.now()%5)}));
  SESSION={q,i:0,total:q.length,mode:'mock',answers:[],rated:new Set(),before:{}};
  nextCard();
}
function mockResult(){
  const A=SESSION.answers;const by={yomi:[0,0],kaki:[0,0],stroke:[0,0]};
  let score=0;
  A.forEach(({c,g})=>{const t=c.type==='yomi'?'yomi':c.type==='kaki'?'kaki':'stroke';by[t][1]++;if(g==='good'){by[t][0]++;score+=MOCK.point}});
  const wrong=[...new Set(A.filter(a=>a.g!=='good').map(a=>a.c))];
  // まちがえた もんだいを あしたの ふくしゅうへ
  const tm=new Date();tm.setDate(tm.getDate()+1);tm.setHours(0,0,0,0);
  wrong.forEach(c=>{
    const ks=kstate(c.k);
    if(ks.intro){const it=getItem(c.id);if(it.reps>0&&new Date(it.card.due)>tm){it.card.due=tm.toISOString()}}
    else if(!S.priority.includes(c.k))S.priority.push(c.k);
  });
  S.mocks.push({t:Date.now(),score,by});
  if(S.plan&&S.plan.date===today())S.plan=null;
  save();
  const pass=score>=MOCK.pass;
  const row=(l,[a,n])=>`<tr><td>${l}</td><td>${a} / ${n}</td><td><div class="bar" style="min-width:140px"><i style="width:${n?a/n*100:0}%;background:var(--cover)"></i></div></td></tr>`;
  mount(`<div class="sheet done">
    ${pass?hanamaruSvg():''}
    <h2>${score}てん <span class="muted" style="font-size:24px">/ 150てん</span></h2>
    <p style="font-size:22px;font-weight:700;color:${pass?'var(--red)':'var(--ink2)'}">${pass?'ごうかく ライン こえたよ！':`ごうかく まで あと ${MOCK.pass-score}てん`}</p>
    <table class="stats-table" style="max-width:520px;margin:20px auto">${row('よみ',by.yomi)}${row('かきとり',by.kaki)}${row('かきじゅん・かくすう',by.stroke)}</table>
    ${wrong.length?`<p style="font-size:19px">まちがえた かんじは、あしたの れんしゅうに でるよ</p><div class="newstars">${[...new Set(wrong.map(c=>c.k))].map(k=>`<div class="tile s${Math.max(1,stage(k))}" style="width:72px;font-size:40px">${k}</div>`).join('')}</div>`:''}
    <button class="btn" id="hm">ホームへ</button></div>`);
  $('#hm').onclick=()=>Home();
  if(pass)drawHanamaru();
}

/* =================== おうちの かた =================== */
function Parent(){
  const st=S.settings;const ei=examInfo();
  const n=Object.values(S.days).reduce((a,d)=>a+(d.n||0),0);
  const weak=KANJI.filter(k=>S.kanji[k]&&S.kanji[k].weak);
  const last7=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const v=S.days[ymd(d)];return{d,n:v?v.n:0}});
  mount(`<div class="topbar"><button class="iconbtn" id="back" aria-label="もどる">${IC.back}</button><h2>おうちの方へ</h2></div>
  <div class="parent">
    <section class="sheet">
      <h3>設定</h3>
      <label>受検日 <input type="date" id="exam" value="${st.examDate||''}"></label>
      <label>1日の学習時間の目安 <select id="min">${[5,10,15,20,30].map(v=>`<option value="${v}" ${st.minutes==v?'selected':''}>${v}分</option>`).join('')}</select></label>
      <label>仕上げ期間（新しい漢字を出さない日数） <select id="fin">${[0,2,3,5].map(v=>`<option value="${v}" ${st.finishDays==v?'selected':''}>${v}日</option>`).join('')}</select></label>
      <label>新しい漢字を出す順番 <select id="ord"><option value="list" ${st.order==='list'?'selected':''}>学年別漢字配当表の順</option><option value="strokes" ${st.order==='strokes'?'selected':''}>画数の少ない順</option></select></label>
      <p>受検日までの日数から、1日に出す新しい漢字の数を自動で決めます。変更は翌日の計画から反映されます（今日の計画を作り直す場合は下のボタン）。</p>
      <button class="btn ghost small" id="replan">今日の計画を作り直す</button>
    </section>
    <section class="sheet">
      <h3>進み具合</h3>
      <table class="stats-table">
        <tr><th>出会った漢字</th><td>${KANJI.filter(k=>kstate(k).intro).length} / 80字</td></tr>
        <tr><th>★以上（覚えた）</th><td>${KANJI.filter(k=>stage(k)>=3).length}字</td></tr>
        <tr><th>答えた問題（累計）</th><td>${n}問</td></tr>
        <tr><th>にがて漢字</th><td class="k" style="font-size:22px">${weak.join(' ')||'なし'}</td></tr>
        <tr><th>模擬テスト</th><td>${S.mocks.slice(-5).map(m=>`${new Date(m.t).getMonth()+1}/${new Date(m.t).getDate()}: ${m.score}点`).join('　')||'まだ受けていません'}</td></tr>
        <tr><th>直近7日</th><td>${last7.map(x=>`${x.d.getMonth()+1}/${x.d.getDate()}:${x.n}`).join('　')}</td></tr>
      </table>
      ${ei.future?`<p>受検日まであと${ei.days}日。未学習の漢字は${KANJI.filter(k=>!kstate(k).intro).length}字です。</p>`:''}
    </section>
    <section class="sheet">
      <h3>書き取りの記録（新しい順）</h3>
      <p>お子さんの自己採点と書いた字です。採点が甘いと感じたら、声をかけてあげてください。</p>
      <div class="hwlog">${S.hwlog.slice().reverse().map(h=>`<figure><img src="${h.img}" alt=""><div><span class="k" style="font-size:20px">${h.k}</span> <span class="g">${{good:'○',hard:'△',again:'×'}[h.g]}</span></div><div>${new Date(h.t).getMonth()+1}/${new Date(h.t).getDate()}</div></figure>`).join('')||'<p>まだありません</p>'}</div>
    </section>
    <section class="sheet">
      <h3>バックアップ</h3>
      <p>学習記録はこのiPadの中だけに保存されています。週に1回ほど書き出しておくと安心です。</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn small" id="exp">記録を書き出す</button>
        <label class="btn ghost small" style="margin:0">記録を読み込む<input type="file" id="imp" accept="application/json,.json" class="hidden"></label>
        <button class="btn ghost small" id="reset" style="color:var(--red)">すべて消す</button>
      </div>
    </section>
    <section class="sheet">
      <h3>このアプリについて</h3>
      <p>漢検10級（小学1年の80字）の読み・書き取り・筆順・画数を、間隔反復（FSRS）で学習します。問題文はこのアプリ用に作成したもので、過去問ではありません。</p>
      <p>筆順データ：KanjiVG（© Ulrich Apel, CC BY-SA 3.0）。漢検の筆順は文部省「筆順指導の手びき」が基準のため、気になる字は教科書でご確認ください。スケジュール計算：ts-fsrs（MIT License）。</p>
    </section>
  </div>`);
  $('#back').onclick=()=>Home();
  $('#exam').onchange=e=>{st.examDate=e.target.value;save()};
  $('#min').onchange=e=>{st.minutes=+e.target.value;save()};
  $('#fin').onchange=e=>{st.finishDays=+e.target.value;save()};
  $('#ord').onchange=e=>{st.order=e.target.value;save()};
  $('#replan').onclick=()=>{
    const td=today();
    // まだ はじめて いない きょうの 新出だけ やりなおす
    if(S.plan&&S.plan.date===td){S.plan.newK.forEach(k=>{const ks=kstate(k);if(ks.intro===td&&!ks.introDone)ks.intro=null})}
    S.plan=null;planToday();save();toast('今日の計画を作り直しました');
  };
  $('#exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({app:'kk10',v:1,S,HW})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kanji-renshu-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  };
  $('#imp').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const o=JSON.parse(await f.text());if(o.app!=='kk10')throw 0;if(!(await ask('今の記録を、読み込んだ記録で置き換えますか？','置き換える',false,'キャンセル')))return;S=o.S;HW=o.HW||{first:{},last:{}};save();toast('読み込みました');Parent()}
    catch(_){toast('このファイルは読み込めません')}
  };
  $('#reset').onclick=async()=>{if(await ask('学習記録をすべて消します。元に戻せません。','すべて消す',true,'キャンセル')){S=defaultState();HW={first:{},last:{}};save();Home()}};
}

/* ---------- 起動 ---------- */
if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
Home();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('.home'))Home()});
</script>
</body>
</html>
